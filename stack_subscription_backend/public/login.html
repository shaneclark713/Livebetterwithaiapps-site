<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>$STACK Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/assets/main.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Secure $STACK Login</h1>
      <p>Enter the email used at checkout. If your subscription is active, a secure login link will be sent.</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <br><br>
        <button type="submit">Send login link</button>
      </form>
      <p id="message" class="small"></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      msg.textContent = 'Checking access...';
      const email = document.getElementById('email').value;
      const res = await fetch('/auth/request-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Could not send login link.';
        msg.className = 'small error';
        return;
      }
      msg.textContent = data.devLoginUrl ? `Development login link: ${data.devLoginUrl}` : 'Check your email for the secure login link.';
      msg.className = 'small ok';
    });
  </script>
</body>
</html>
