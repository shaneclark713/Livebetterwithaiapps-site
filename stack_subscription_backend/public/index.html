<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>$STACK Subscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/assets/main.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>$STACK Intelligence</h1>
      <p>Advanced Packaging & AI Infrastructure research access.</p>

      <form id="checkout-form">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <h2>Choose access tier</h2>

        <label style="display:block; margin-bottom:12px;">
          <input type="radio" name="tier" value="retail" checked style="width:auto;">
          Retail — $49.99/month
        </label>

        <label style="display:block; margin-bottom:12px;">
          <input type="radio" name="tier" value="institutional" style="width:auto;">
          Institutional — $249.99/month
        </label>

        <br>
        <button type="submit">Subscribe & Access Dashboard</button>
      </form>

      <p class="small">
        Already subscribed? <a class="button" href="/login.html">Log in</a>
      </p>
      <p id="message" class="small"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('checkout-form');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      msg.textContent = 'Creating secure checkout...';

      const email = document.getElementById('email').value;
      const tier = document.querySelector('input[name="tier"]:checked').value;

      const res = await fetch('/api/checkout/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, tier })
      });

      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || 'Checkout failed.';
        msg.className = 'small error';
        return;
      }

      window.location.href = data.url;
    });
  </script>
</body>
</html>
