<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>$STACK Index | Secure Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/assets/main.css" rel="stylesheet">

  <!-- GA tag goes here ONLY because this page is protected server-side.
       If you add Google Analytics, place the script below this comment.
       That way a dashboard view means the protected page actually loaded. -->
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>$STACK Secure Dashboard</h1>
      <p id="whoami">Checking access...</p>

      <div class="grid grid-3">
        <div class="metric"><span>Current access</span><strong class="ok">Active</strong></div>
        <div class="metric"><span>Tier</span><strong id="tier">Loading</strong></div>
        <div class="metric"><span>Status</span><strong>Protected</strong></div>
      </div>

      <h2>Protected sample data</h2>
      <pre id="payload" class="card" style="overflow:auto;"></pre>

      <button id="logout">Log out</button>
    </section>
  </main>

  <script>
    async function loadDashboard() {
      const meRes = await fetch('/api/dashboard/me', { credentials: 'include' });
      if (!meRes.ok) {
        window.location.href = '/login.html';
        return;
      }

      const me = await meRes.json();
      document.getElementById('whoami').textContent = `Logged in as ${me.email}`;
      document.getElementById('tier').textContent =
        me.tier === 'institutional' ? 'Institutional' : 'Retail';

      const dataRes = await fetch('/api/dashboard/data', { credentials: 'include' });
      const data = await dataRes.json();
      document.getElementById('payload').textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    });

    loadDashboard();
  </script>
</body>
</html>
